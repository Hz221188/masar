<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مناطق الخدمة – مسار للصيانة</title>

<style>
    body {
        margin: 0;
        font-family: "Tajawal", sans-serif;
        background: #8f8f8f; /* خلفية رمادية */
        color: #1a1a1a;
    }

    /* ====== الهيدر مع الشعار ====== */
    .header {
        padding: 30px 20px;
        text-align: center;
    }
    .header img {
        width: 120px;
        margin-bottom: 10px;
    }
    .header h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        color: #0b3d2e;
    }
    .header p {
        margin-top: 8px;
        font-size: 18px;
        opacity: .8;
    }

    /* ====== صندوق الخريطة الزجاجي ====== */
    .map-container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        border: 1px solid rgba(255,255,255,0.4);
        text-align: center;
    }

    .map-container iframe {
        width: 100%;
        height: 520px;
        border: none;
        border-radius: 18px;
    }

    /* ====== زر تحديد الموقع ====== */
    .locate-btn {
        margin-top: 20px;
        background: #0f5b4a;
        color: white;
        padding: 12px 26px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        cursor: pointer;
    }

    /* ====== زر العودة ====== */
    .cta {
        text-align: center;
        margin: 40px 0;
    }
    .cta a {
        background: #0f5b4a;
        color: white;
        padding: 14px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
    }
</style>
</head>

<body>

<!-- ====== الهيدر مع الشعار ====== -->
<div class="header">
    <img src="logo.png" alt="شعار مسار">
    <h1>مناطق الخدمة</h1>
    <p>نغطي أحياء مختارة داخل مدينة الرياض – خدمة سريعة واحترافية</p>
</div>

<!-- ====== الخريطة الزجاجية ====== -->
<div class="map-container">
    <iframe 
        id="serviceMap"
        src="https://www.google.com/maps/d/u/0/embed?mid=1qBUGhdDxxWMD6HY6ZMiYbfIOgUGxqlw&ehbc=2E312F&noprof=1">
    </iframe>

    <button class="locate-btn" onclick="locateUser()">تحديد موقعي</button>
</div>


<!-- ====== زر العودة ====== -->
<div class="cta">
    <a href="https://almasarat.sa">العودة للمتجر الرئيسي</a>
</div>

<script>
function locateUser() {
    if (!navigator.geolocation) {
        alert("المتصفح لا يدعم تحديد الموقع");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            // فتح موقع العميل على الخريطة
            const mapFrame = document.getElementById("serviceMap");
            mapFrame.src = `https://www.google.com/maps?q=${lat},${lng}&z=15&output=embed`;

            alert("تم تحديد موقعك على الخريطة");
        },
        () => {
            alert("لم يتم السماح بالوصول إلى الموقع");
        }
    );
}
</script>

</body>
</html>
