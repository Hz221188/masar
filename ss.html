<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مناطق الخدمة في الرياض – مسار للصيانة</title>

<meta name="description" content="تعرف على مناطق الخدمة التي يغطيها فريق مسار للصيانة في الرياض. صيانة مكيفات، غسالات، ثلاجات، وأجهزة منزلية في أحياء شرق وشمال الرياض مع خدمة سريعة واحترافية.">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "مسار للصيانة",
  "image": "https://app.almasarat.sa/logo.png",
  "url": "https://almasarat.sa",
  "telephone": "+966500000000",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "الرياض",
    "addressRegion": "منطقة الرياض",
    "addressCountry": "السعودية"
  },
  "description": "خدمات صيانة المكيفات والغسالات والثلاجات والأجهزة المنزلية داخل مدينة الرياض مع فنيين متخصصين وخدمة سريعة.",
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 24.774265,
    "longitude": 46.738586
  },
  "openingHours": "Su-Sa 08:00-23:00",
  "priceRange": "$$",
  "areaServed": [
    "حي لبن",
    "حي العريجا",
    "حي المهدية",
    "حي العوالي",
    "حي طويق",
    "حي السويدي",
    "حي عرقة"
  ],
  "sameAs": [
    "https://www.facebook.com/",
    "https://www.instagram.com/",
    "https://www.twitter.com/"
  ]
}
</script>

<style>
    body {
        margin: 0;
        font-family: "Tajawal", sans-serif;
        background: #a2a2a2;
        color: #1a1a1a;
    }

    /* ====== الهيدر ====== */
    .header {
        padding: 30px 20px;
        text-align: center;
    }
    .header img {
        width: 120px;
        margin-bottom: 10px;
    }
    .header h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        color: #0b3d2e;
    }
    .header p {
        margin-top: 10px;
        font-size: 18px;
        opacity: .85;
    }

    /* ====== صندوق الخريطة ====== */
    .map-container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        border: 1px solid rgba(255,255,255,0.4);
        text-align: center;
    }

    .map-container iframe {
        width: 100%;
        height: 520px;
        border: none;
        border-radius: 18px;
    }

    /* ====== زر تحديد الموقع ====== */
    .locate-btn {
        margin-top: 20px;
        background: #0f5b4a;
        color: white;
        padding: 12px 26px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }
    .locate-btn:hover {
        background: #0c4a3a;
    }

    /* ====== زر العودة ====== */
    .cta {
        text-align: center;
        margin: 40px 0;
    }
    .cta a {
        background: #0f5b4a;
        color: white;
        padding: 14px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        transition: 0.2s;
    }
    .cta a:hover {
        background: #0c4a3a;
    }

    /* ====== فقرة SEO ====== */
    .seo-text {
        max-width: 900px;
        margin: 30px auto;
        font-size: 18px;
        line-height: 1.8;
        text-align: center;
        color: #1a1a1a;
    }
</style>
</head>

<body>

<!-- ====== الهيدر ====== -->
<div class="header">
    <img src="logo.png" alt="شعار مسار للصيانة">
    <h1>مناطق الخدمة</h1>
    <p>نغطي أحياء مختارة داخل مدينة الرياض – خدمة سريعة واحترافية</p>
</div>

<!-- ====== فقرة SEO ====== -->
<div class="seo-text">
    نقدم خدمات الصيانة المنزلية في عدد من أحياء الرياض، تشمل صيانة المكيفات، الغسالات، الثلاجات، والأجهزة المنزلية. يعمل فريق مسار للصيانة على تغطية الأحياء بشكل مستمر لضمان وصول الخدمة بسرعة وكفاءة.
</div>

<!-- ====== الخريطة ====== -->
<div class="map-container">
    <iframe 
        id="serviceMap"
        src="https://www.google.com/maps/d/u/0/embed?mid=1qBUGhdDxxWMD6HY6ZMiYbfIOgUGxqlw&ehbc=2E312F&noprof=1">
    </iframe>

    <button class="locate-btn" onclick="locateUser()">تحديد موقعي</button>
</div>

<!-- ====== زر العودة ====== -->
<div class="cta">
    <a href="https://almasarat.sa">العودة للمتجر الرئيسي</a>
</div>

<script>
function locateUser() {
    if (!navigator.geolocation) {
        alert("المتصفح لا يدعم تحديد الموقع");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            const mapFrame = document.getElementById("serviceMap");
            mapFrame.src = `https://www.google.com/maps?q=${lat},${lng}&z=15&output=embed`;

            alert("تم تحديد موقعك على الخريطة");
        },
        () => {
            alert("لم يتم السماح بالوصول إلى الموقع");
        }
    );
}
</script>

</body>
</html>
